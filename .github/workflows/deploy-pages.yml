name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build category pages + sitemap
        run: node scripts/build-pages.mjs

      - name: Check data, images and links
        run: node scripts/check-site.mjs

      # คัดเฉพาะไฟล์ของเว็บไปโฟลเดอร์ _site — ไม่เอาไฟล์ภายในขึ้นเว็บสาธารณะ
      # (เอกสาร/สคริปต์ build/โค้ด Apps Script) เก็บ stock-check/ ไว้เพราะใช้งานผ่านเว็บ
      - name: Assemble site (exclude dev-only files)
        run: |
          mkdir _site
          tar --exclude=./_site --exclude=./.git --exclude=./.github \
              --exclude=./.claude --exclude=./.gitignore \
              --exclude=./docs --exclude=./scripts \
              --exclude=./stock-check/apps-script --exclude='*.md' \
              -cf - . | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/stock-check/index.html
          test -f _site/stock-check/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
