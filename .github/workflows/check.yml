name: Check site

# รันทุกครั้งที่เปิด/อัปเดต PR (ให้เห็นผลก่อน merge)
# บน main ไม่ต้องรันซ้ำ — deploy-pages.yml รันตัวเช็คเดียวกันก่อน deploy อยู่แล้ว
# build หน้าหมวดใหม่ก่อน (เหมือนตอน deploy) แล้วค่อยเช็คข้อมูล/รูป/ลิงก์
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build category pages + sitemap
        run: node scripts/build-pages.mjs

      - name: Check data, images and links
        run: node scripts/check-site.mjs
